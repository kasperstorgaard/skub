name: e2e tests
run-name: "e2e — ${{ github.event.deployment.description }}"

on:
  deployment_status:

concurrency:
  group: e2e-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'preview'
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.pr.outputs.should-run }}
      base-url: ${{ steps.pr.outputs.base-url }}
    steps:
      - name: Check for open, non-draft PR
        id: pr
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}/pulls \
            --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "No open PR found"
            exit 0
          fi
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
          if [ "$STATE" = "open" ] && [ "$DRAFT" = "false" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Skipping: state=$STATE draft=$DRAFT"
          fi
          # Branch timeline URL: Deploy drops "/" from the branch name.
          BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')
          echo "base-url=https://ricochet--${BRANCH//\//}.kasperstorgaard.deno.net" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: [check-pr]
    if: needs.check-pr.outputs.should-run == 'true'
    # One run per branch database: a newer push's reset would wipe this run.
    concurrency:
      group: e2e-${{ needs.check-pr.outputs.base-url }}
      cancel-in-progress: true
    # Playwright 1.59 has no chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    env:
      BASE_URL: ${{ needs.check-pr.outputs.base-url }}
      DEPLOY_SHA: ${{ github.event.deployment.sha }}

    steps:
      - name: Post pending status
        run: |
          gh api repos/${{ github.repository }}/statuses/$DEPLOY_SHA \
            --method POST \
            -f state=pending \
            -f context="e2e tests" \
            -f description="Running affected tests on the branch deploy..." \
            -f target_url="$BASE_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          # 2.7.12 fails, issue filed
          deno-version: 2.9.8

      - name: Select tests
        id: select
        run: |
          FILES=$(deno run -A scripts/select-e2e-tests.ts)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Generate puzzle manifest
        if: steps.select.outputs.files != ''
        run: deno run -A scripts/generate-manifest.ts

      - name: Install Playwright
        if: steps.select.outputs.files != ''
        run: npx playwright install chromium --with-deps

      # Empties the branch database. Deploy points the branch URL at a new
      # build a little after this event fires, so retry (10s apart, up to 3
      # minutes) until the reset answers from the build under test: its
      # buildId must match the revision id in the per-commit URL.
      - name: Reset branch database
        if: steps.select.outputs.files != ''
        run: |
          # https://ricochet-<revision>.kasperstorgaard.deno.net -> <revision>
          HOST=${REVISION_URL#https://}
          REVISION=${HOST%%.*}
          REVISION=${REVISION#ricochet-}
          for attempt in $(seq 18); do
            BUILD_ID=$(curl -sS -f -X POST "$BASE_URL/api/e2e/reset" \
              -H "x-e2e-secret: $E2E_SECRET" | jq -r '.buildId') || true
            if [ "$BUILD_ID" = "$REVISION" ]; then
              echo "Reset on $REVISION"
              exit 0
            fi
            echo "Branch serves ${BUILD_ID:-no reset}, waiting for $REVISION"
            sleep 10
          done
          echo "::error::Branch deploy never served $REVISION"
          exit 1
        env:
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          REVISION_URL: ${{ github.event.deployment_status.environment_url }}

      - name: Run e2e tests
        if: steps.select.outputs.files != ''
        run: |
          read -ra FILES <<< "$TEST_FILES"
          deno test -A --no-check "${FILES[@]}"
        env:
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          TEST_FILES: ${{ steps.select.outputs.files }}

      - name: Post final status
        if: always()
        run: |
          gh api repos/${{ github.repository }}/statuses/$DEPLOY_SHA \
            --method POST \
            -f state="$STATE" \
            -f context="e2e tests" \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESC: ${{ job.status != 'success' && 'Tests failed' || steps.select.outputs.files == '' && 'No e2e tests affected' || 'All tests passed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
