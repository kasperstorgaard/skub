name: e2e tests
run-name: "e2e — ${{ github.event.deployment.description || github.event.pull_request.title }}"

on:
  deployment_status:
  # Marking ready doesn't redeploy, so test the branch's current build
  pull_request:
    types: [ready_for_review]
    paths:
      - deno/**
      - .github/workflows/e2e.yml

jobs:
  check-pr:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'preview')
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.pr.outputs.should-run }}
      base-url: ${{ steps.pr.outputs.base-url }}
      sha: ${{ steps.pr.outputs.sha }}
      revision-url: ${{ steps.pr.outputs.revision-url }}
    steps:
      - name: Check for open, non-draft PR
        id: pr
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            SHA=$PR_HEAD_SHA
            # The per-commit URL of the deploy registered for this commit
            DEPLOY_ID=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=preview" \
              --jq '.[0].id // empty')
            if [ -z "$DEPLOY_ID" ]; then
              echo "should-run=false" >> $GITHUB_OUTPUT
              echo "No deploy yet; e2e runs when it lands"
              exit 0
            fi
            REVISION_URL=$(gh api "repos/$REPO/deployments/$DEPLOY_ID/statuses" \
              --jq '.[0].environment_url')
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "revision-url=$REVISION_URL" >> $GITHUB_OUTPUT

          PR_JSON=$(gh api repos/$REPO/commits/$SHA/pulls --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "No open PR found"
            exit 0
          fi
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
          if [ "$STATE" = "open" ] && [ "$DRAFT" = "false" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Skipping: state=$STATE draft=$DRAFT"
          fi
          # Branch timeline URL: Deploy drops "/" from the branch name.
          BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')
          echo "base-url=https://ricochet--${BRANCH//\//}.kasperstorgaard.deno.net" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.event.deployment.sha }}
          REVISION_URL: ${{ github.event.deployment_status.environment_url }}

  e2e:
    needs: [check-pr]
    if: needs.check-pr.outputs.should-run == 'true'
    # One run per branch database: a newer push's reset would wipe this run.
    concurrency:
      group: e2e-${{ needs.check-pr.outputs.base-url }}
      cancel-in-progress: true
    # Playwright 1.59 has no chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    defaults:
      run:
        working-directory: deno
    env:
      BASE_URL: ${{ needs.check-pr.outputs.base-url }}
      DEPLOY_SHA: ${{ needs.check-pr.outputs.sha }}

    steps:
      - name: Post pending status
        # Runs before checkout, so deno/ doesn't exist yet
        working-directory: .
        run: |
          gh api repos/${{ github.repository }}/statuses/$DEPLOY_SHA \
            --method POST \
            -f state=pending \
            -f context="e2e tests" \
            -f description="Running affected tests on the branch deploy..." \
            -f target_url="$BASE_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-pr.outputs.sha }}
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          # 2.7.12 fails, issue filed
          deno-version: 2.9.8

      - name: Select tests
        id: select
        run: |
          FILES=$(deno run -A scripts/select-e2e-tests.ts)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Generate puzzle manifest
        if: steps.select.outputs.files != ''
        run: deno run -A scripts/generate-manifest.ts

      - name: Install Playwright
        if: steps.select.outputs.files != ''
        run: npx playwright install chromium --with-deps

      # Empties the branch database; fails if the branch URL isn't serving
      # this revision yet (re-run the job).
      - name: Reset branch database
        if: steps.select.outputs.files != ''
        run: |
          HOST=${REVISION_URL#https://}
          REVISION=${HOST%%.*}
          BUILD_ID=$(curl -sSf -X POST "$BASE_URL/api/e2e/reset" \
            -H "x-e2e-secret: $E2E_SECRET" | jq -r .buildId)
          test "$BUILD_ID" = "${REVISION#ricochet-}"
        env:
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          REVISION_URL: ${{ needs.check-pr.outputs.revision-url }}

      - name: Run e2e tests
        if: steps.select.outputs.files != ''
        run: |
          read -ra FILES <<< "$TEST_FILES"
          deno test -A --no-check "${FILES[@]}"
        env:
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          TEST_FILES: ${{ steps.select.outputs.files }}

      - name: Post final status
        if: always()
        run: |
          gh api repos/${{ github.repository }}/statuses/$DEPLOY_SHA \
            --method POST \
            -f state="$STATE" \
            -f context="e2e tests" \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
        env:
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'error' || 'failure' }}
          DESC: ${{ job.status == 'cancelled' && 'Superseded by a newer push' || job.status != 'success' && 'Tests failed' || steps.select.outputs.files == '' && 'No e2e tests affected' || 'All tests passed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
