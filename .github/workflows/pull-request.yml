name: Pull Request
# Verify formatting, linting and unit tests on ready PRs; drafts skip

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deno

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.9.8

      - name: Verify formatting
        run: deno fmt --check

      # The repo-wide files sit outside the app's deno.json
      - name: Verify formatting of repo-wide files
        working-directory: .
        run: deno fmt --check --ignore=deno,specs,spec.md,README.md,CLAUDE.md .

      - name: Run linter
        run: deno lint

      - name: Run tests
        run: deno test -A --ignore=e2e/,routes/**/_e2e/

      - name: Build
        run: deno task build

      - name: Check CSS
        run: deno task check-css
